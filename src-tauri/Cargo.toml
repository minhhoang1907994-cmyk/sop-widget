[package]
name = "sop-widget"
version = "2.0.0"
description = "Local SOP runner with evidence capture"
authors = ["Nitro Tech Asia"]
edition = "2021"

[lib]
name = "sop_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# macos-private-api: bắt buộc cho cửa sổ transparent trên macOS (app.macOSPrivateApi trong
# tauri.conf.json). Trên Windows feature này không có tác dụng gì.
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
screenshots = "0.8"
sha2 = "0.10"
base64 = "0.22"
# rustls thay vì native-tls để không phụ thuộc OpenSSL khi build trên Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
